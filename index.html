<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle of Trust - Member Portal & Admin</title>
  <style>
    :root {
      --primary-color: #1b4d3e;
      --secondary-color: #2c7a6f;
      --accent-color: #d4af37;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    .admin-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 20px;
      border-top: 4px solid var(--accent-color);
    }

    .admin-card h2 {
      font-size: 1.1rem;
      color: var(--primary-color);
      margin-bottom: 14px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #555;
    }

    input, select, button {
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--secondary-color);
    }

    .btn-submit {
      background-color: var(--secondary-color);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      grid-column: 1 / -1;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--primary-color);
    }

    .search-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      border-left: 5px solid var(--secondary-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .stat-card.accent {
      border-left-color: var(--accent-color);
    }

    .stat-card h3 {
      font-size: 0.8rem;
      color: #666;
      text-transform: uppercase;
    }

    .stat-card p {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-top: 4px;
    }

    .statement-section {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .statement-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    th {
      background-color: #f8f9fa;
      color: #555;
    }

    .text-right {
      text-align: right;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: #888;
    }

    @media print {
      body { background: white; padding: 0; }
      .admin-card, .search-card, button { display: none !important; }
      .statement-section { box-shadow: none; padding: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Circle of Trust (SEARCH COT)</h1>
      <p>Mobile Portal & Admin Entry Form</p>
    </header>

    <div class="admin-card">
      <h2>+ Record New Transaction / Add Member</h2>
      <form id="adminForm" class="admin-grid">
        <div class="form-group">
          <label for="entryMemberId">Member ID</label>
          <input type="text" id="entryMemberId" placeholder="e.g. 40199469" required>
        </div>
        <div class="form-group">
          <label for="entryName">Member Name</label>
          <input type="text" id="entryName" placeholder="e.g. MARY ANYANGO" required>
        </div>
        <div class="form-group">
          <label for="entryType">Transaction Type</label>
          <select id="entryType">
            <option value="Savings Deposit">Savings Deposit</option>
            <option value="Registration Fee">Registration Fee</option>
            <option value="Loan Issued">Loan Issued</option>
            <option value="Loan Repayment">Loan Repayment</option>
          </select>
        </div>
        <div class="form-group">
          <label for="entryAmount">Amount (KES)</label>
          <input type="number" id="entryAmount" placeholder="e.g. 200" min="0" required>
        </div>
        <div class="form-group">
          <label for="entryDate">Date</label>
          <input type="date" id="entryDate" required>
        </div>
        <button type="submit" class="btn-submit">Save Entry to Database</button>
      </form>
    </div>

    <div class="search-card">
      <div class="search-box">
        <input type="text" id="memberSearchInput" placeholder="Search by Member ID or Name...">
        <button id="searchBtn" style="background:var(--secondary-color); color:white; border:none; border-radius:8px; padding:0 18px; font-weight:600; cursor:pointer;">Search</button>
      </div>
    </div>

    <div id="portalContent">
      <div class="stats-grid">
        <div class="stat-card">
          <h3>Member Name</h3>
          <p id="memberNameDisplay">--</p>
        </div>
        <div class="stat-card">
          <h3>Member ID</h3>
          <p id="memberIdDisplay">--</p>
        </div>
        <div class="stat-card accent">
          <h3>Total Savings</h3>
          <p id="totalSavingsDisplay">KES 0.00</p>
        </div>
        <div class="stat-card">
          <h3>Active Loan</h3>
          <p id="loanBalanceDisplay">KES 0.00</p>
        </div>
      </div>

      <div class="statement-section">
        <div class="statement-header">
          <h2>Transaction History</h2>
          <button onclick="window.print()" style="background:transparent; border:1px solid var(--secondary-color); color:var(--secondary-color); padding:4px 12px; border-radius:6px; font-weight:600; cursor:pointer;">Print</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th class="text-right">Debit</th>
              <th class="text-right">Credit</th>
              <th class="text-right">Balance</th>
            </tr>
          </thead>
          <tbody id="transactionTableBody">
            <tr>
              <td colspan="5" class="empty-state">Enter a Member ID or Name to view records.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, get, set, child } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB9yLNm68mEK4PzO1wj5_jCWn7qTSiOSm0",
      authDomain: "cot-search-portal.firebaseapp.com",
      databaseURL: "https://cot-search-portal-default-rtdb.firebaseio.com",
      projectId: "cot-search-portal",
      storageBucket: "cot-search-portal.firebasestorage.app",
      messagingSenderId: "774313878126",
      appId: "1:774313878126:web:cd91b1eba849ba3020bc7f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Set default date picker to today
    document.getElementById("entryDate").valueToDate = new Date();
    document.getElementById("entryDate").value = new Date().toISOString().split('T')[0];

    // Admin Submit: Add Deposit, Loan, or Member
    document.getElementById("adminForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const id = document.getElementById("entryMemberId").value.trim();
      const name = document.getElementById("entryName").value.trim().toUpperCase();
      const type = document.getElementById("entryType").value;
      const amount = parseFloat(document.getElementById("entryAmount").value);
      const date = document.getElementById("entryDate").value;

      try {
        const memberRef = ref(db, `members/${id}`);
        const snapshot = await get(memberRef);
        
        let memberData = snapshot.exists() ? snapshot.val() : {
          id: id,
          name: name,
          savingsTotal: 0,
          loanBalance: 0,
          transactions: []
        };

        memberData.name = name;
        if (!memberData.transactions) memberData.transactions = [];

        let debit = "-";
        let credit = "-";

        if (type === "Savings Deposit" || type === "Registration Fee") {
          credit = amount;
          memberData.savingsTotal = (memberData.savingsTotal || 0) + amount;
        } else if (type === "Loan Issued") {
          debit = amount;
          memberData.loanBalance = (memberData.loanBalance || 0) + amount;
        } else if (type === "Loan Repayment") {
          credit = amount;
          memberData.loanBalance = Math.max(0, (memberData.loanBalance || 0) - amount);
        }

        const newTx = {
          date: date,
          desc: type,
          debit: debit,
          credit: credit,
          balance: type.includes("Loan") ? memberData.loanBalance : memberData.savingsTotal
        };

        memberData.transactions.push(newTx);

        // Update Firebase
        await set(memberRef, memberData);
        alert("Transaction saved successfully!");
        
        // Refresh View
        renderMemberData(memberData);
        document.getElementById("entryAmount").value = "";
      } catch (err) {
        console.error("Error saving data:", err);
        alert("Failed to save entry. Check network connection.");
      }
    });

    // Search Member
    async function searchMember() {
      const query = document.getElementById("memberSearchInput").value.trim().toLowerCase();
      if (!query) return;

      try {
        const dbRef = ref(db);
        const snapshot = await get(child(dbRef, `members/${query}`));
        if (snapshot.exists()) {
          renderMemberData(snapshot.val());
        } else {
          renderMemberData(null);
        }
      } catch (err) {
        console.error("Error fetching data:", err);
      }
    }

    function renderMemberData(member) {
      const tbody = document.getElementById("transactionTableBody");
      
      if (!member) {
        document.getElementById("memberNameDisplay").innerText = "Not Found";
        document.getElementById("memberIdDisplay").innerText = "N/A";
        document.getElementById("totalSavingsDisplay").innerText = "KES 0.00";
        document.getElementById("loanBalanceDisplay").innerText = "KES 0.00";
        tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No records found.</td></tr>`;
        return;
      }

      document.getElementById("memberNameDisplay").innerText = member.name;
      document.getElementById("memberIdDisplay").innerText = member.id || "N/A";
      document.getElementById("totalSavingsDisplay").innerText = `KES ${(member.savingsTotal || 0).toLocaleString()}`;
      document.getElementById("loanBalanceDisplay").innerText = `KES ${(member.loanBalance || 0).toLocaleString()}`;

      if (member.transactions && member.transactions.length > 0) {
        tbody.innerHTML = member.transactions.map(t => `
          <tr>
            <td>${t.date}</td>
            <td>${t.desc}</td>
            <td class="text-right">${t.debit !== "-" ? 'KES ' + t.debit : '-'}</td>
            <td class="text-right">${t.credit !== "-" ? 'KES ' + t.credit : '-'}</td>
            <td class="text-right"><strong>KES ${t.balance}</strong></td>
          </tr>
        `).join('');
      } else {
        tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No transactions recorded yet.</td></tr>`;
      }
    }

    document.getElementById("searchBtn").addEventListener("click", searchMember);
    document.getElementById("memberSearchInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") searchMember();
    });
  </script>
</body>
</html>
