<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle of Trust - Member Portal</title>
  <style>
    :root {
      --primary-color: #1b4d3e;
      --secondary-color: #2c7a6f;
      --accent-color: #d4af37;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
      --danger-color: #c0392b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    .auth-bar {
      position: absolute;
      top: 15px;
      right: 15px;
    }

    .auth-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }

    .auth-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Admin Card & Tab System */
    .admin-card {
      display: none;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 20px;
      border-top: 4px solid var(--accent-color);
    }

    .admin-card h2 {
      font-size: 1.1rem;
      color: var(--primary-color);
      margin-bottom: 14px;
    }

    .admin-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
    }

    .tab-btn {
      background: #e9ecef;
      color: var(--text-color);
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #555;
    }

    input, select, button {
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--secondary-color);
    }

    .btn-submit {
      background-color: var(--secondary-color);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      grid-column: 1 / -1;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--primary-color);
    }

    .btn-action {
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      border: none;
      margin-right: 4px;
    }

    .btn-edit { background-color: #f39c12; color: white; }
    .btn-delete { background-color: var(--danger-color); color: white; }

    .search-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
    }
